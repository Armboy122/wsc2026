<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#2A1D52">
  <title>PEA Knowledge Voice Agent</title>
  <meta name="description" content="ผู้ช่วยเสียง PEA ตอบจากเอกสารความรู้ที่ได้รับอนุมัติ">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232A1D52'/%3E%3Cpath d='M18 5 9.2 17.6h5.4L13.4 27l8.9-12.6h-5.4L18 5z' fill='%23FFD9A0'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#voice-toggle">ข้ามไปยังปุ่มโหมดเสียง</a>

  <div class="app">
    <header class="app-header">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M13.6 1.6 4.9 13.9h4.9L8.6 22.4l9.1-12.7h-5l.9-8.1z"/></svg>
        </span>
        <div class="brand-text">
          <h1 class="brand-title">PEA Knowledge Voice Agent</h1>
          <p class="brand-sub">ผู้ช่วยเสียงตอบจากเอกสารความรู้ PEA</p>
        </div>
      </div>
      <div class="header-actions">
        <div class="header-buttons">
          <a id="phone-btn" class="ghost-btn" href="phone.html" title="เปิดหน้าจำลองโทรศัพท์ 1129">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <span>โทร 1129</span>
          </a>
        </div>
      </div>
    </header>

    <main class="thread" id="thread" role="log" aria-label="บทสนทนา">
      <section class="notice notice-welcome" id="welcome">
        <h2>ยินดีต้อนรับ</h2>
        <p>กดปุ่ม <strong>🎙 โหมดเสียง</strong> แล้วถามเรื่องบริการของ กฟภ. ผู้ช่วยจะตอบจากเอกสารความรู้ที่ได้รับอนุมัติเท่านั้น</p>
      </section>
    </main>

    <section class="composer" aria-label="โหมดเสียง">
      <div class="composer-form">
        <button type="button" id="voice-toggle" class="voice-btn" aria-pressed="false" aria-label="เริ่มโหมดเสียง" title="เริ่มโหมดเสียง">
          <span aria-hidden="true">🎙</span><span class="visually-hidden">โหมดเสียง</span>
        </button>
      </div>
      <p class="voice-status" id="voice-status" role="status" hidden></p>
      <p class="composer-meta">ไม่มีการแสดงลำดับความคิด (chain-of-thought) ของโมเดล</p>
    </section>
  </div>

  <p class="sr-status" role="status" aria-live="polite" id="sr-status"></p>

  <script type="module" src="app.js"></script>
</body>
</html>
