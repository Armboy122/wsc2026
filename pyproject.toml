[project]
name = "pea-one-agent"
version = "0.1.0"
description = "PEA One Agent hackathon MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
# google-genai คือ SDK ของ Gemini Live ที่ runtime เสียง (app/runtime/) ใช้ผ่าน ADK
# Knowledge เป็น deterministic ไม่เรียก LLM
voice = [
  "google-genai>=1.0,<3.0",
]
adk = ["google-adk==2.9.1"]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["app/api/tests", "app/core/tests", "tests"]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
