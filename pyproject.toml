[project]
name = "pea-one-agent"
version = "0.1.0"
description = "PEA One Agent hackathon MVP"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.8,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "httpx>=0.27",
  # ใช้อ่าน plugin manifest ตอน startup (เดิมติดมากับ uvicorn[standard] โดยบังเอิญ)
  "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
# google-genai คือ SDK ของ Gemini ที่ "โหมดเสียง" (app/live/) ต้องใช้แบบ hard dependency
# ส่วน Knowledge นำเข้าแบบ lazy
voice = [
  "google-genai>=1.0,<2.0",
]
dev = [
  "httpx>=0.27",
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["app/api/tests", "app/core/tests", "app/live/tests", "app/llm/tests", "tests", "knowledge/tests", "app/tools/tests", "app/backends/tests", "app/plugins/tests"]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
