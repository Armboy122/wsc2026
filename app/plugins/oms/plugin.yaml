# D2.7: ย้าย oms_tool ขึ้น declarative tool contract (DB) แล้ว — ปิดปลั๊กอิน Python นี้แบบ
# soft delete (เหมือน tool.enabled=0 ของ D2.1) แทนการลบไฟล์ทิ้ง เพื่อคงประวัติของสัญญาเดิมไว้
# ให้เทียบได้ ตัว tool จริงตอนนี้อยู่ใน SQLite (ดู scripts/seed_oms_tool.py) — operations[]
# ด้านล่างนี้คือต้นฉบับที่คัดลอก schema ไปสร้างแถวใน DB ทุกประการ ไม่ได้ถูกโหลดหรือใช้งานจริง
# อีกต่อไป (app.plugins.oms.factory ที่ runtime.factory ชี้ไปถูกลบไปพร้อมกับ app/tools/oms_tool.py
# — เหมือนที่ billing scaffold ในเทสของ loader ก็มี runtime.factory ที่ไม่ resolve ได้ตอนปิดอยู่)
# app/plugins/oms/response.py (OmsResponsePolicy) และ app/plugins/oms/demo.py (OmsDemoBehavior)
# ยังใช้งานอยู่ — ผูกตรงใน app/main.py แทนที่จะผ่าน loader นี้ เพราะเป็นแค่ presentation/demo
# layer ที่ไม่ต้องพึ่ง tool ตัวไหนเป็นเจ้าของ
apiVersion: pea.one/v1
kind: Plugin

metadata:
  id: oms_tool
  name: OMS Outage
  enabled: false
  category: operational
  description: >
    ตรวจเหตุไฟฟ้าขัดข้องด้วยหมายเลขผู้ใช้ไฟ 12 หลัก
    หรือเตรียมแจ้งเหตุเมื่อทราบหรือไม่ทราบหมายเลขผู้ใช้ไฟ

runtime:
  factory: app.plugins.oms.factory:create_plugin

configuration:
  baseUrlEnv: OMS_BASE_URL
  timeoutEnv: OMS_TIMEOUT_SECONDS
  apiKeyEnv: OMS_API_KEY

operations:
  - action: get_outage_by_ca
    description: >
      ตรวจสอบเหตุไฟฟ้าขัดข้องจากหมายเลขผู้ใช้ไฟ 12 หลัก
      โดย OMS จะ resolve Meter → Transformer → Feeder
    exposure: llm
    mode: read
    inputSchema:
      type: object
      properties:
        caNumber:
          type: string
          description: หมายเลขผู้ใช้ไฟ 12 หลัก
      required: [caNumber]
      additionalProperties: false
    outputContract: OmsGetOutageByCaOutput
    policy: plain_read

  - action: prepare_outage_with_ca
    description: >
      เตรียมแจ้งเหตุเมื่อทราบหมายเลขผู้ใช้ไฟ
      แต่ยังไม่ส่งจนกว่าผู้ใช้จะยืนยันอย่างชัดเจน
    exposure: llm
    mode: prepare
    submitAction: submit_outage_with_ca
    inputSchema:
      type: object
      properties:
        caNumber:
          type: string
          description: หมายเลขผู้ใช้ไฟ 12 หลัก
        description:
          type: string
          description: อาการที่ผู้ใช้แจ้ง
        contactPhone:
          anyOf:
            - type: string
            - type: "null"
          description: เบอร์ติดต่อกลับ (ไม่บังคับ)
        locationNote:
          anyOf:
            - type: string
            - type: "null"
          description: จุดสังเกตเพิ่มเติมของสถานที่ (ไม่บังคับ)
        idempotencyKey:
          type: string
          description: กันการส่งซ้ำจากการเรียกซ้ำ
      required: [caNumber, description, idempotencyKey]
      additionalProperties: false
    outputContract: OmsPrepareOutageOutput
    policy: write_confirm

  - action: submit_outage_with_ca
    description: >
      ส่งรายการที่ผ่านการยืนยันจากผู้ใช้แล้วไปยัง OMS
    exposure: internal
    mode: submit
    inputSchema:
      type: object
      properties:
        pendingActionId:
          type: string
          description: รหัสของรายการที่เตรียมไว้และผู้ใช้ยืนยันแล้ว
        idempotencyKey:
          type: string
          description: กันการส่งซ้ำจากการเรียกซ้ำ
      required: [pendingActionId, idempotencyKey]
      additionalProperties: false
    outputContract: OmsCreateOutageWithCaOutput
    policy: write_confirm

  - action: prepare_anonymous_outage
    description: >
      เตรียมแจ้งเหตุเมื่อไม่ทราบหมายเลขผู้ใช้ไฟ
      โดยใช้อาการที่เกิดขึ้น สถานที่ และเบอร์ติดต่อกลับ
    exposure: llm
    mode: prepare
    submitAction: submit_anonymous_outage
    inputSchema:
      type: object
      properties:
        description:
          type: string
          description: อาการที่ผู้ใช้แจ้ง
        location:
          type: string
          description: สถานที่เกิดเหตุ
        contactPhone:
          type: string
          description: เบอร์ติดต่อกลับ
        idempotencyKey:
          type: string
          description: กันการส่งซ้ำจากการเรียกซ้ำ
        lat:
          anyOf:
            - type: number
            - type: "null"
          description: พิกัดละติจูดจากอุปกรณ์ผู้ใช้ (เติมจาก clientContext ไม่ใช่ให้ LLM กรอกเอง)
        lon:
          anyOf:
            - type: number
            - type: "null"
          description: พิกัดลองจิจูดจากอุปกรณ์ผู้ใช้ (เติมจาก clientContext ไม่ใช่ให้ LLM กรอกเอง)
      required: [description, location, contactPhone, idempotencyKey]
      additionalProperties: false
    outputContract: OmsPrepareOutageOutput
    policy: write_confirm
    clientContext:
      lat: lat
      lon: lon

  - action: submit_anonymous_outage
    description: >
      ส่งรายการแจ้งเหตุแบบไม่ทราบหมายเลขผู้ใช้ไฟหลังผู้ใช้ยืนยัน
    exposure: internal
    mode: submit
    inputSchema:
      type: object
      properties:
        pendingActionId:
          type: string
          description: รหัสของรายการที่เตรียมไว้และผู้ใช้ยืนยันแล้ว
        idempotencyKey:
          type: string
          description: กันการส่งซ้ำจากการเรียกซ้ำ
      required: [pendingActionId, idempotencyKey]
      additionalProperties: false
    outputContract: OmsCreateAnonymousOutageOutput
    policy: write_confirm
