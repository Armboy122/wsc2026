[project]
name = "pea-voice-assistant"
version = "0.1.0a1"
description = "Knowledge-first lab — ค้น Markdown และถามตอบพร้อมหลักฐาน"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1", "pydantic>=2.8,<3",
  "httpx>=0.27,<1", "cryptography>=44",
  "python-dotenv>=1,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]
[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
