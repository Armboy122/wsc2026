          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalidClassification:
              value:
                simulation: true
                error:
                  code: INVALID_CLASSIFICATION
                  message: ประเภทเรื่องไม่สัมพันธ์กับ journey หรือ taxonomy ที่เลือก
                  fields: [classification]
            consentRequired:
              value:
                simulation: true
                error:
